  - num: III
    id: edtech-systems
    title: Educational Technology Systems
    noun: projects
  - num: IV
    id: learning-resources
    title: Interactive Learning Resources
    noun: resources
    collapsible: true
  - num: V
    id: developer-tooling
    title: Developer Tooling
    noun: projects
  - num: VI
    id: executive-programme
    title: Executive Programme Projects
    noun: projects
    intro: copy:section-vi   # the "Section VI intro line" block of docs/copy/profile-readme-copy.md
featured: [siem-log-analyzer, student-engagement-api, verifiable-academic-credentials, aws-terraform-gameday, neural-network-playground, epidemic-modeling-dashboard]
roadmap:
  - name: Bastion Range
    pitch: Enterprise security learning sandbox that emulates adversary behaviour against a disposable environment and scores the defender's response in real time, mapped to MITRE ATT&CK and NIST CSF.
    anchor: flagship-1--bastion-range-enterprise-security-learning-sandbox-cybersecurity--edtech--cs
  - name: Sentinel Ledger
    pitch: AI/ML model auditing and telemetry gateway that sits between applications and models, detecting prompt injection, PII leakage, drift and poisoning signals, with a tamper-evident audit trail.
    anchor: flagship-2--sentinel-ledger-aiml-model-auditing--telemetry-platform-data-science--cybersecurity--technologist
  - name: Atlas Tutor
    pitch: Self-hostable adaptive RAG tutor with a knowledge-graph skill model that generates objective-aligned assessments and runs on a single GPU node or a laptop.
    anchor: flagship-3--atlas-tutor-adaptive-multimodal-learning-engine-edtech--data-science--distributed-systems
