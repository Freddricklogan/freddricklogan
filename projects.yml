# Data source for the profile README (scripts/update_readme.py renders the portfolio block of README.md from this file).
# One entry per repository. Fields:
#   repo        GitHub repository name (URL never changes)
#   title       display title
#   section     I data-ml | II cloud-security | III edtech-systems | IV learning-resources | V developer-tooling | VI executive-programme
#   tier        T1 | T2 | T3
#   live        live demo URL (Pages, container, or null)
#   case_study  path to the case study inside the repo (rendered as "Case study" in every project row)
#   ci          true when the repo has .github/workflows/deploy.yml (renders the CI shield)
#   status      done | in-progress | planned | archived
#   description one-line row text (HTML entities not needed; the renderer escapes)
#   tech        the row's Tech line (or Format line when `format: true`)
#   image       Unsplash photo id, rendered as images.unsplash.com/photo-<id>?…&w=300&h=180
#   alt         image alt text
#   replaces    repositories this one supersedes (archived, listed under the row)
#   programme   (section VI) University of Oxford Saïd Business School programme the project is aligned to
#   issued      (section VI) month the programme certificate was issued (docs/MODERNIZATION_BLUEPRINT.md §2B)
#   demo_route  route of the demo on the deployed host when `live` is null (rendered as a note, never as a dead link)
# Tier labels rendered as shields: T1 Flagship · T2 Showcase · T3 Consolidated.
#   theme       Executive Shell palette (data-theme): I signal · II graphite · III ember · IV plum · V forest · VI midnight
#   accent      primary (default) | secondary — swaps the palette's two hues for variety inside a category
#
# sections: the portfolio taxonomy rendered in order (num, id, title, noun, collapsible, intro)
# featured: six repos shown in the 3×2 grid after the Executive Summary (copy: docs/copy/profile-readme-copy.md)
# roadmap:  planned convergence flagships (docs/MODERNIZATION_BLUEPRINT.md §2A); intro from the copy file
sections:
