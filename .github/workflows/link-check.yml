name: Link check (advisory)

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Link check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 4 --accept 200,206,429,999
            --exclude 'github.com/${{ github.repository }}/actions'
            README.md
          fail: true
