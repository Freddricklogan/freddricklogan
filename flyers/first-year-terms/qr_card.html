<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:600px;height:720px;background:#fff;font-family:'Helvetica Neue',Arial,sans-serif}
.card{width:600px;height:720px;border-top:10px solid #C8102E;padding:40px 50px 0;text-align:center;position:relative}
img{width:440px;height:440px;display:block;margin:0 auto}
h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:44px;color:#0a0a0a;margin:26px 0 0;letter-spacing:-.5px}
.rule{width:60px;height:3px;background:#C8102E;margin:16px auto 0}
.foot{position:absolute;left:0;right:0;bottom:0;background:#C8102E;color:#fff;font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;padding:16px 0}
</style></head><body><div class="card">
<img src="qr.png" alt="QR code to sign up for Elevate">
<h1>Sign Up for Elevate</h1><div class="rule"></div>
<div class="foot">Scan with your phone camera</div>
</div></body></html>
